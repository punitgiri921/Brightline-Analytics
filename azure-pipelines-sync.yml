# Azure DevOps to GitHub Mirror Sync Pipeline
# Automatically synchronizes Brightline-Analytics Azure DevOps repo to GitHub on every commit to main

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self
  persistCredentials: true
  fetchDepth: 0

- script: |
    echo "Configuring Git credentials..."
    git config --global user.email "punitgiri74@gmail.com"
    git config --global user.name "Brightline Azure DevOps Sync"

    echo "Adding GitHub Remote..."
    git remote remove github 2>/dev/null || true
    git remote add github https://$(GH_TOKEN)@github.com/punitgiri921/Brightline-Analytics.git

    echo "Pushing all branches and tags to GitHub..."
    git push github main --force --tags
  displayName: 'Sync Azure DevOps to GitHub (Mirror)'
  env:
    GH_TOKEN: $(GH_TOKEN)
