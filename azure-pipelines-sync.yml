# Azure DevOps to GitHub Mirror Sync Pipeline
# Automatically synchronizes Brightline-Analytics Azure DevOps repo to GitHub on every commit to main

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self
  persistCredentials: true
  fetchDepth: 0

- bash: |
    set -e
    echo "Setting Git identity..."
    git config --global user.email "punitgiri921@gmail.com"
    git config --global user.name "Brightline Azure DevOps Sync"

    echo "Pushing commits and tags to GitHub..."
    git push "https://x-access-token:${GH_TOKEN}@github.com/punitgiri921/Brightline-Analytics.git" HEAD:main --force --tags
    echo "SUCCESS: Mirror push to GitHub completed!"
  displayName: 'Sync Azure DevOps to GitHub (Mirror)'
  env:
    GH_TOKEN: $(GH_TOKEN)
